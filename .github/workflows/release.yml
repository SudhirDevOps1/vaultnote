name: Release

# Cut a release by pushing a version tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Nothing is published unless every gate in the build job passes, so a tag on
# a broken commit produces a failed workflow rather than a broken installer.
#
# The build runs on a GitHub runner. It must not: the app is developed on a
# 2-core 15W ultrabook where `tauri build` (LTO, opt-level="s",
# codegen-units=1) would run for hours and shut the machine down. A debug
# build is fine locally for iterating; release packaging is not.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release from (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag being built
        id: tag
        shell: pwsh
        run: |
          $t = if ("${{ github.event.inputs.tag }}" -ne "") { "${{ github.event.inputs.tag }}" }
               else { "${{ github.ref_name }}" }
          if (-not $t.StartsWith("v")) { throw "tag must start with 'v', got '$t'" }
          "tag=$t" >> $env:GITHUB_OUTPUT
          Write-Host "Building release: $t"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Hard stop, and deliberately independent of the release-please config.
      #
      # bump-minor-pre-major keeps release-please from proposing 1.0.0, but
      # nothing stops a human from typing `git tag v1.0.0` by hand. This app
      # has never been built into a binary or launched once, so a tag without a
      # pre-release suffix would publish installers labelled as stable on the
      # strength of code that has only ever been unit tested.
      #
      # To lift this, delete this step once the app has been run for real and
      # the checklist in README "Known gaps" has actually been closed.
      - name: Refuse a non-prerelease tag
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+-(alpha|beta|rc)') {
            Write-Host "Refusing to publish $tag"
            Write-Host "Only pre-release tags are allowed while the app is unverified."
            Write-Host "It has never been built into a binary or launched. Use v0.1.0-alpha.1."
            exit 1
          }
          Write-Host "$tag is a pre-release tag - proceeding"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          shared-key: release

      # The same gates as CI, re-run here. A tag can be pushed onto a commit
      # that never went green, and this is the last point where that is
      # visible before an installer is handed to someone.
      - name: Verify tests still pass on this exact commit
        working-directory: src-tauri
        run: cargo test -- --test-threads=1

      - name: Sync manifests to the tag version
        shell: pwsh
        run: |
          # release-please owns package.json only. Cargo.toml and
          # tauri.conf.json are rewritten here so all three agree before the
          # build, which keeps release-please away from its TOML extra-file
          # handling.
          $tagVersion = "${{ steps.tag.outputs.tag }}" -replace '^v', ''
          Write-Host "syncing manifests to $tagVersion"

          $cargo = "src-tauri/Cargo.toml"
          (Get-Content $cargo -Raw) -replace '(?m)^version = "[^"]*"', "version = `"$tagVersion`"" |
            Set-Content $cargo -NoNewline

          $conf = "src-tauri/tauri.conf.json"
          $j = Get-Content $conf -Raw | ConvertFrom-Json
          $j.version = $tagVersion
          $j | ConvertTo-Json -Depth 20 | Set-Content $conf

          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json)
          $pkg.version = $tagVersion
          $pkg | ConvertTo-Json -Depth 20 | Set-Content package.json

      - name: Verify all manifests agree
        shell: pwsh
        run: |
          $tagVersion = "${{ steps.tag.outputs.tag }}" -replace '^v', ''
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+?)"').Matches[0].Groups[1].Value
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "tag=$tagVersion  Cargo.toml=$cargo  tauri.conf.json=$tauri  package.json=$pkg"
          if ($cargo -ne $tagVersion -or $tauri -ne $tagVersion -or $pkg -ne $tagVersion) {
            throw "version mismatch after sync"
          }
          Write-Host "all manifests agree"

      # Unsigned. A Windows installer with no Authenticode signature triggers
      # SmartScreen, and that is the correct trade for a pre-1.0 build: signing
      # needs a code-signing certificate, which costs money and would be
      # attached to a project that has not been security-reviewed yet.
      #
      # One build only. An earlier draft ran `--no-bundle` first and then the
      # real build, which compiled everything twice for no benefit.
      - name: Build installers
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: List produced artifacts
        shell: pwsh
        run: |
          $dirs = @("src-tauri/target/release/bundle")
          foreach ($d in $dirs) {
            if (Test-Path $d) {
              Get-ChildItem $d -Recurse -File |
                Where-Object { $_.Extension -in ".exe", ".msi" } |
                ForEach-Object { Write-Host ("{0}  {1:N1} MB" -f $_.FullName, ($_.Length/1MB)) }
            }
          }

      # Uploads to an existing release rather than creating one. Version,
      # changelog and the release itself are owned by release-please; this
      # workflow's only job is producing binaries and attaching them. Two
      # workflows racing to `gh release create` is a deadlock waiting to happen.
      - name: Attach installers to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $files = @(Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File -ErrorAction SilentlyContinue |
                     Where-Object { $_.Extension -in ".exe", ".msi" })
          if ($files.Count -eq 0) { throw "no installer artifacts were produced" }
          if (-not (gh release view $env:TAG 2>$null)) {
            throw "release $env:TAG does not exist. release-please creates it; this workflow only attaches binaries."
          }
          gh release upload $env:TAG $files.FullName --clobber
          Write-Host "attached $($files.Count) installer(s) to $env:TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: vaultnote-${{ steps.tag.outputs.tag }}
          path: src-tauri/target/release/bundle/**/*.exe
          retention-days: 30